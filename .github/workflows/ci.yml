name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix tests/browser-runtime --no-save --ignore-scripts playwright@1.62.1
      # Official development image, pinned to the matching version and digest.
      # Synthetic content only; this is not a production crawling environment.
      - run: >-
          docker run --rm --init --network=none --memory=512m --memory-swap=512m
          --pids-limit=256 --cap-drop=ALL --security-opt=no-new-privileges
          --read-only --tmpfs /tmp:rw,size=64m --user pwuser
          --mount type=bind,source=${{ github.workspace }}/tools,target=/probe,readonly
          --mount type=bind,source=${{ github.workspace }}/tests/browser-runtime/node_modules,target=/dependencies,readonly
          -e NODE_PATH=/dependencies -e CX2_BROWSER_PROBE=1 -e CX2_EXPECT_MEMORY_LIMIT_BYTES=536870912
          mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
          node /probe/browser_runtime_probe.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix tests/browser-runtime --no-save --ignore-scripts playwright@1.62.1
      - run: node tests/browser-runtime/node_modules/playwright/cli.js install --with-deps chromium-headless-shell
      - run: node tests/browser_delivery_fixture.cjs
        env:
          NODE_PATH: ./tests/browser-runtime/node_modules
      - run: node tests/browser_owned_delivery.cjs
        env:
          NODE_PATH: ./tests/browser-runtime/node_modules
      - run: node tools/browser_runtime_probe.cjs
        env:
          NODE_PATH: ./tests/browser-runtime/node_modules
          CX2_BROWSER_PROBE: "1"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tests/template_intake.test.cjs
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CX2_TEST_DSN: postgresql://postgres:test-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m unittest discover -s tests -p test_postgres.py -v
      - run: python -m unittest discover -s tests -p test_delivery_postgres.py -v
      - run: python -m unittest discover -s tests -p test_delivery_candidate_postgres.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --prefix tests/browser-runtime --no-save --ignore-scripts playwright@1.62.1
      - run: node tests/browser-runtime/node_modules/playwright/cli.js install --with-deps chromium-headless-shell
      - run: node tests/browser_delivery_fixture.cjs
        env:
          NODE_PATH: ./tests/browser-runtime/node_modules
          CX2_BROWSER_POSTGRES: "1"
      - run: node tests/browser_owned_delivery.cjs
        env:
          NODE_PATH: ./tests/browser-runtime/node_modules
          CX2_BROWSER_POSTGRES: "1"
