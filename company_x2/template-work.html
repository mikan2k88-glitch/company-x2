<!doctype html><html lang="ja"><meta charset="utf-8"><title>Template work / データ整備の検証</title>
<style>body{max-width:850px;margin:32px auto;background:#1b2230;color:#eee;font:16px sans-serif}textarea,input{width:100%;margin:8px 0;padding:8px;box-sizing:border-box}button{padding:12px;margin:8px}pre{white-space:pre-wrap}label{display:block}input[type=checkbox]{width:auto}</style>
<h1>データ整備の検証 / Template work experiment</h1>
<p>管理者用試作。列対応を確認して原文を転記します。状態と検査証跡だけを保存します。外部AI・店舗更新は行いません。<br>Admin experiment: metadata-only workflow records; no external AI or store updates.</p>
<label>目的 / Intended result<input id="purpose" value="商品一覧を指定形式に整える / Prepare product template"></label>
<label>元CSV / Source CSV<textarea id="source" rows="5">sku,title
001,Sample product</textarea></label>
<label>完成形の見本CSV / Destination template CSV<textarea id="template">商品コード,商品名</textarea></label>
<button id="suggest">列対応を提案 / Suggest column mapping</button>
<label>完成テンプレートの列（JSON） / Destination columns<textarea id="columns">["SKU","Title"]</textarea></label>
<label>列対応（JSON） / Destination to source mapping<textarea id="mapping">{"SKU":"sku","Title":"title"}</textarea></label>
<label>必須列（JSON） / Required columns<textarea id="required">["SKU","Title"]</textarea></label>
<label><input type="checkbox" id="scope">個人情報・機密情報、重大判断・本番更新、追加責任条件を含まない / No sensitive data, critical use, production updates or extra liability requirements</label>
<button id="plan">計画・確認事項 / Plan</button><pre id="result"></pre>
<label><input type="checkbox" id="consent">表示された計画・条件に同意 / Accept displayed plan and conditions</label>
<button id="execute" disabled>制作・検査 / Produce and verify</button><a id="download" hidden>CSVを保存 / Download CSV</a>
<button id="receive" disabled>受領確認 / Confirm receipt</button>
<script>
let approved=null, blobURL=null, requestKey=null, artifactHash=null;
const byId=id=>document.getElementById(id);
function payload(){if(!byId('scope').checked)throw Error('範囲を確認してください / Confirm scope');return {purpose:byId('purpose').value,csv:byId('source').value,columns:JSON.parse(byId('columns').value),mapping:JSON.parse(byId('mapping').value),required:JSON.parse(byId('required').value),risk_context:{sensitive_data:'no',critical_use:'no',extra_liability:'no'}}}
function reset(){approved=null;requestKey=null;artifactHash=null;byId('receive').disabled=true;byId('execute').disabled=true;byId('consent').checked=false;byId('download').hidden=true;if(blobURL){URL.revokeObjectURL(blobURL);blobURL=null}}
document.querySelectorAll('input,textarea').forEach(el=>{if(el.id!=='consent')el.addEventListener('input',reset)});
async function send(action,data){const r=await fetch('/api/company/template-work/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw Error(value.error||'Request failed');return value}
byId('plan').onclick=async()=>{reset();try{const data=payload();const value=await send('plan',data);requestKey=crypto.randomUUID();await send('request',{...data,request_key:requestKey});byId('result').textContent=JSON.stringify(value,null,2);approved=value.approval_sha256;byId('execute').disabled=value.plan.questions.length>0}catch(e){reset();byId('result').textContent=e.message}};
byId('suggest').onclick=async()=>{reset();try{const value=await send('suggest',{...payload(),template_csv:byId('template').value});byId('columns').value=JSON.stringify(value.columns);byId('mapping').value=JSON.stringify(value.mapping);byId('required').value='[]';byId('result').textContent=JSON.stringify(value,null,2)}catch(e){byId('result').textContent=e.message}};
byId('execute').onclick=async()=>{byId('execute').disabled=true;try{if(!approved||!byId('consent').checked)throw Error('計画への同意が必要 / Accept the plan');const value=await send('process',{...payload(),request_key:requestKey,accepted:true,approval_sha256:approved});artifactHash=value.artifact_sha256;byId('result').textContent=JSON.stringify(value.report,null,2);if(blobURL)URL.revokeObjectURL(blobURL);blobURL=URL.createObjectURL(new Blob([value.csv],{type:'text/csv;charset=utf-8'}));byId('download').href=blobURL;byId('download').download='prepared.csv';byId('download').hidden=false;byId('receive').disabled=false}catch(e){byId('result').textContent=e.message;byId('execute').disabled=false}};
byId('receive').onclick=async()=>{try{const value=await send('receive',{request_key:requestKey,artifact_sha256:artifactHash,accepted:true});byId('result').textContent=JSON.stringify(value,null,2);byId('receive').disabled=true}catch(e){byId('result').textContent=e.message}};
</script></html>
